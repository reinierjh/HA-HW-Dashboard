views:
  - title: RTE overzicht
    path: rte_overzicht
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |-
              {% macro pct(v) %}{% if v not in ['unknown', 'unavailable', 'none', ''] %}{{ v }}{% else %}&#8211;{% endif %}{% endmacro %}
              | Batterij | 24h | 7d | weekly | monthly | quarterly | yearly | alltime |
              |---|---|---|---|---|---|---|---|
              | Batterij 1 | {{ pct(states('sensor.batt1_rte_24h')) }} | {{ pct(states('sensor.batt1_rte_7d')) }} | {{ pct(states('sensor.batt1_rte_weekly')) }} | {{ pct(states('sensor.batt1_rte_monthly')) }} | {{ pct(states('sensor.batt1_rte_quarterly')) }} | {{ pct(states('sensor.batt1_rte_yearly')) }} | {{ pct(states('sensor.batt1_rte_alltime')) }} |
              | Batterij 2 | {{ pct(states('sensor.batt2_rte_24h')) }} | {{ pct(states('sensor.batt2_rte_7d')) }} | {{ pct(states('sensor.batt2_rte_weekly')) }} | {{ pct(states('sensor.batt2_rte_monthly')) }} | {{ pct(states('sensor.batt2_rte_quarterly')) }} | {{ pct(states('sensor.batt2_rte_yearly')) }} | {{ pct(states('sensor.batt2_rte_alltime')) }} |
              | Batterij 3 | {{ pct(states('sensor.batt3_rte_24h')) }} | {{ pct(states('sensor.batt3_rte_7d')) }} | {{ pct(states('sensor.batt3_rte_weekly')) }} | {{ pct(states('sensor.batt3_rte_monthly')) }} | {{ pct(states('sensor.batt3_rte_quarterly')) }} | {{ pct(states('sensor.batt3_rte_yearly')) }} | {{ pct(states('sensor.batt3_rte_alltime')) }} |
              | Batterij 4 | {{ pct(states('sensor.batt4_rte_24h')) }} | {{ pct(states('sensor.batt4_rte_7d')) }} | {{ pct(states('sensor.batt4_rte_weekly')) }} | {{ pct(states('sensor.batt4_rte_monthly')) }} | {{ pct(states('sensor.batt4_rte_quarterly')) }} | {{ pct(states('sensor.batt4_rte_yearly')) }} | {{ pct(states('sensor.batt4_rte_alltime')) }} |
              | Totaal | {{ pct(states('sensor.totaal_rte_24h')) }} | {{ pct(states('sensor.totaal_rte_7d')) }} | {{ pct(states('sensor.totaal_rte_weekly')) }} | {{ pct(states('sensor.totaal_rte_monthly')) }} | {{ pct(states('sensor.totaal_rte_quarterly')) }} | {{ pct(states('sensor.totaal_rte_yearly')) }} | {{ pct(states('sensor.totaal_rte_alltime')) }} |
      - type: grid
        cards:
          - type: custom:apexcharts-card
            header: { show: true, title: 'RTE 24h' }
            graph_span: 45d
            yaxis:
              - min: 0
                max: 110
            series:
              - entity: sensor.batt1_rte_24h
