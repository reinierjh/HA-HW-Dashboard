              **RTE** = round-trip efficiency: (ontladen kWh / laden kWh) x 100%.
              <br>24h & 7d: rolling windows met SOC-correctie (rekent accu-energie mee).
              <br>Weekly t/m yearly: kalenderperiodes via utility_meter (last period).
              <br>All-time: lifetime totalen van de meter (geen history nodig).