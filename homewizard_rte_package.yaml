# HomeWizard batterijen - RTE (round-trip efficiency)
# Hybride: 24h/7d rolling + SOC-correctie (statistics), weekly..yearly kalender (utility_meter)
# Werkt zonder lange recorder-retentie (purge_keep_days kan laag blijven, bv. 7 dagen).
# Plaats dit bestand in config/packages/ en voeg toe aan configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
homewizard_rte_package:

  sensor:
    - platform: statistics
      entity_id: sensor.plug_in_battery_1_energy_import
      name: batt1_import_24h
      unique_id: batt1_import_24h
      state_characteristic: sum_differences
      max_age:
        hours: 24
    - platform: statistics
      entity_id: sensor.plug_in_battery_1_energy_export
      name: batt1_export_24h
      unique_id: batt1_export_24h
      state_characteristic: sum_differences
      max_age:
        hours: 24
    - platform: statistics
      entity_id: sensor.plug_in_battery_1_state_of_charge
      name: batt1_soc_delta_24h
      unique_id: batt1_soc_delta_24h
      state_characteristic: change
      max_age:
