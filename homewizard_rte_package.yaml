# ============================================================
# TOELICHTING
# ============================================================
# 24h/7d: rolling windows via statistics-platform, met SOC-correctie:
#   RTE = export / (import - dE) * 100,  dE = (SoC_eind - SoC_begin)/100 * 2,473 kWh
#   Dit corrigeert voor het feit dat de accu aan het begin/einde van het venster
#   niet even gevuld hoeft te zijn (was de oorzaak van bizar hoge waarden).
#
# weekly..yearly: kalenderperiodes via utility_meter. last_period wordt door de
#   meter zelf bijgehouden en na een restart hersteld uit de restore-data in de DB,
#   dus zonder lange ruwe history -> werkt ook met een korte retentie.
#   Over zulke lange periodes is SOC-correctie niet nodig (grensafwijking is
#   verwaarloosbaar t.o.v. de totale doorloop).
#
#   Tot de eerste periode-omwenteling is last_period leeg; dan toont de RTE-sensor
#   de LOPENDE periode (native value van de meter) als fallback, zodat je direct
#   waarden ziet. Na elke omwenteling (weekly: maandagnacht, monthly: 1e van de
#   maand, quarterly: 1 jan/apr/jul/okt, yearly: 1 jan) wordt de voltooide periode
#   getoond.
#
# Let op: er zijn GEEN 30d/90d/365d rolling windows mogelijk met een korte
# recorder-retentie (de statistics-sensor leest alleen ruwe history).
#
# all_time: lifetime totalen (native energy_import/export, cumulatief sinds
#   installatie). Geen history of SOC-correctie nodig -> altijd geldig,
#   onafhankelijk van purge_keep_days.
#
# Verwijder na de eerste installatie eventueel oude entity-registraties
# (*_rte_30d/90d/365d en *_soc_delta_30d/90d/365d) als die niet meer bestaan:
#   Instellingen > Apparaten en diensten > Entiteiten > Verwijderen