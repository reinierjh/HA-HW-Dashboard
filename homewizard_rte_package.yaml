  template:
    - sensor:
        - name: batt1_rte_24h
          unique_id: batt1_rte_24h
          state_class: measurement
          unit_of_measurement: '%'
          icon: mdi:battery-charging-outline
          state: >-
            {% set i = states('sensor.batt1_import_24h') | float(0) %}
            {% set e = states('sensor.batt1_export_24h') | float(0) %}
            {% set s = states('sensor.batt1_soc_delta_24h') | float(0) %}
            {% set de = s / 100 * 2.473 %}
            {% set den = i - de %}
            {% if den > 0 %}
              {% set rte = e / den * 100 %}
              {% if rte > 100 %}{{ 100.0 }}{% elif rte < 0 %}{{ 0.0 }}{% else %}{{ rte | round(1) }}{% endif %}
            {% else %}unknown{% endif %}
        - name: batt1_rte_7d
          unique_id: batt1_rte_7d
          state_class: measurement
          unit_of_measurement: '%'
          icon: mdi:battery-charging-outline
          state: >-
            {% set i = states('sensor.batt1_import_7d') | float(0) %}
            {% set e = states('sensor.batt1_export_7d') | float(0) %}
            {% set s = states('sensor.batt1_soc_delta_7d') | float(0) %}
            {% set de = s / 100 * 2.473 %}
            {% set den = i - de %}
            {% if den > 0 %}
              {% set rte = e / den * 100 %}
              {% if rte > 100 %}{{ 100.0 }}{% elif rte < 0 %}{{ 0.0 }}{% else %}{{ rte | round(1) }}{% endif %}
            {% else %}unknown{% endif %}
        - name: batt1_rte_weekly
          unique_id: batt1_rte_weekly
          state_class: measurement
          unit_of_measurement: '%'
          icon: mdi:battery-charging-outline
          state: >-
            {% set i_last = state_attr('sensor.batt1_import_weekly', 'last_period') | float(0) %}
            {% set e_last = state_attr('sensor.batt1_export_weekly', 'last_period') | float(0) %}
            {% set i_cur = states('sensor.batt1_import_weekly') | float(0) %}
            {% set e_cur = states('sensor.batt1_export_weekly') | float(0) %}
            {% set i = i_last if i_last > 0 else i_cur %}
            {% set e = e_last if i_last > 0 else e_cur %}
            {% if i > 0 %}{{ (e / i * 100) | round(1) }}{% else %}unknown{% endif %}
